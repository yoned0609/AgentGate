<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="lose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="feat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#f87171" font-size="14" font-weight="600" letter-spacing="3">RED TEAM RESULTS</text>
  <text x="600" y="88" text-anchor="middle" fill="#f1f5f9" font-size="30" font-weight="700">I built an LLM competitor to kill AgentGate.</text>
  <text x="600" y="116" text-anchor="middle" fill="#94a3b8" font-size="18">It lost on every metric that matters.</text>

  <!-- VS Comparison Box -->
  <!-- AgentGate (winner) -->
  <rect x="60" y="145" width="520" height="140" rx="12" fill="url(#win)" stroke="#34d399" stroke-width="1.5"/>
  <text x="80" y="175" fill="#6ee7b7" font-size="13" font-weight="600" letter-spacing="2">AGENTGATE (REGEX + RULES)</text>
  <text x="80" y="210" fill="#d1fae5" font-size="36" font-weight="700">100%</text>
  <text x="205" y="210" fill="#6ee7b7" font-size="16">accuracy</text>
  <text x="80" y="240" fill="#d1fae5" font-size="22" font-weight="600">0.16ms</text>
  <text x="205" y="240" fill="#6ee7b7" font-size="14">avg latency</text>
  <text x="350" y="210" fill="#d1fae5" font-size="22" font-weight="600">$0</text>
  <text x="385" y="210" fill="#6ee7b7" font-size="14">/request</text>
  <text x="350" y="240" fill="#d1fae5" font-size="22" font-weight="600">277</text>
  <text x="410" y="240" fill="#6ee7b7" font-size="14">tests pass</text>

  <!-- LLM Competitor (loser) -->
  <rect x="620" y="145" width="520" height="140" rx="12" fill="url(#lose)" stroke="#f87171" stroke-width="1.5"/>
  <text x="640" y="175" fill="#fca5a5" font-size="13" font-weight="600" letter-spacing="2">LLM COMPETITOR (FULL AI)</text>
  <text x="640" y="210" fill="#fecaca" font-size="36" font-weight="700">94%</text>
  <text x="755" y="210" fill="#fca5a5" font-size="16">accuracy</text>
  <text x="640" y="240" fill="#fecaca" font-size="22" font-weight="600">721ms</text>
  <text x="780" y="240" fill="#fca5a5" font-size="14">avg latency</text>
  <text x="910" y="210" fill="#fecaca" font-size="22" font-weight="600">$0.006</text>
  <text x="1010" y="210" fill="#fca5a5" font-size="14">/request</text>
  <text x="910" y="240" fill="#fecaca" font-size="22" font-weight="600">4,427x</text>
  <text x="1030" y="240" fill="#fca5a5" font-size="14">slower</text>

  <!-- Arrow between -->
  <text x="595" y="225" text-anchor="middle" fill="#fbbf24" font-size="28" font-weight="700">vs</text>

  <!-- Divider -->
  <line x1="60" y1="310" x2="1140" y2="310" stroke="#334155" stroke-width="1"/>
  <text x="600" y="340" text-anchor="middle" fill="#818cf8" font-size="14" font-weight="600" letter-spacing="2">v0.3.0 — GAPS FOUND. GAPS FIXED.</text>

  <!-- Feature Grid (2x3) -->
  <!-- Row 1 -->
  <rect x="60" y="360" width="350" height="72" rx="8" fill="url(#feat)" stroke="#4338ca" stroke-width="1"/>
  <text x="80" y="388" fill="#818cf8" font-size="22" font-weight="700">10</text>
  <text x="110" y="388" fill="#e2e8f0" font-size="15" font-weight="600">Providers</text>
  <text x="80" y="414" fill="#64748b" font-size="12">GitHub · Jira · Notion · Linear · HubSpot · Salesforce · AWS</text>

  <rect x="425" y="360" width="350" height="72" rx="8" fill="url(#feat)" stroke="#4338ca" stroke-width="1"/>
  <text x="445" y="388" fill="#f87171" font-size="15" font-weight="700">NEW</text>
  <text x="490" y="388" fill="#e2e8f0" font-size="15" font-weight="600">Workflow Authorization</text>
  <text x="445" y="414" fill="#64748b" font-size="12">Cross-provider exfiltration detection · Sequence policies</text>

  <rect x="790" y="360" width="350" height="72" rx="8" fill="url(#feat)" stroke="#4338ca" stroke-width="1"/>
  <text x="810" y="388" fill="#e2e8f0" font-size="15" font-weight="600">L3 Async Escalation</text>
  <text x="810" y="414" fill="#64748b" font-size="12">Low-confidence → webhook → human review · Never blocks</text>

  <!-- Row 2 -->
  <rect x="60" y="445" width="350" height="72" rx="8" fill="url(#feat)" stroke="#4338ca" stroke-width="1"/>
  <text x="80" y="473" fill="#818cf8" font-size="22" font-weight="700">6</text>
  <text x="105" y="473" fill="#e2e8f0" font-size="15" font-weight="600">Analytics Endpoints</text>
  <text x="80" y="499" fill="#64748b" font-size="12">Time series · Deny trends · Anomalies · Latency · Heatmaps</text>

  <rect x="425" y="445" width="350" height="72" rx="8" fill="url(#feat)" stroke="#4338ca" stroke-width="1"/>
  <text x="445" y="473" fill="#e2e8f0" font-size="15" font-weight="600">NL Policy Builder</text>
  <text x="445" y="499" fill="#64748b" font-size="12">"Agents can read issues" → valid YAML · Instant load</text>

  <rect x="790" y="445" width="350" height="72" rx="8" fill="url(#feat)" stroke="#4338ca" stroke-width="1"/>
  <text x="810" y="473" fill="#e2e8f0" font-size="15" font-weight="600">12 Policy Templates</text>
  <text x="810" y="499" fill="#64748b" font-size="12">Read-only YAML for every provider · Production-ready</text>

  <!-- Footer -->
  <rect x="60" y="545" width="1080" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="569" text-anchor="middle" fill="#64748b" font-size="12" letter-spacing="1">Python 3.12  ·  FastAPI  ·  10 Providers  ·  277 Tests  ·  MIT License  ·  v0.3.0</text>

  <text x="600" y="610" text-anchor="middle" fill="#475569" font-size="14">github.com/yoned0609/AgentGate</text>
</svg>
