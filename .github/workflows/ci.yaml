name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: python -m pytest -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agentgate:test ./backend

      - name: Verify container starts
        run: |
          docker run -d --name agentgate-test -p 8100:8100 agentgate:test
          sleep 3
          curl -sf http://localhost:8100/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status'] in ('ok','degraded'), f'Unhealthy: {d}'"
          docker stop agentgate-test
