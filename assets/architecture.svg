<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="allow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="deny" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="700" letter-spacing="1">AgentGate</text>
  <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-size="14" letter-spacing="2">THE AUTHORIZATION LAYER MCP DOESN'T HAVE</text>

  <!-- Left: AI Agent -->
  <rect x="40" y="280" width="160" height="80" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="315" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">AI Agent</text>
  <text x="120" y="338" text-anchor="middle" fill="#64748b" font-size="11">MCP Client</text>

  <!-- Arrow: Agent → Gate -->
  <line x1="200" y1="320" x2="265" y2="320" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <defs><marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#6366f1"/></marker></defs>
  <text x="232" y="310" text-anchor="middle" fill="#818cf8" font-size="10">Request</text>

  <!-- AgentGate Main Box -->
  <rect x="270" y="110" width="560" height="500" rx="16" fill="none" stroke="url(#gate)" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="270" y="110" width="560" height="500" rx="16" fill="#0f172a" opacity="0.6"/>

  <!-- Gate Header -->
  <rect x="270" y="110" width="560" height="44" rx="16" fill="url(#gate)" opacity="0.15"/>
  <rect x="270" y="138" width="560" height="16" fill="#0f172a" opacity="0.6"/>
  <text x="550" y="139" text-anchor="middle" fill="#a5b4fc" font-size="15" font-weight="700" letter-spacing="1.5">AgentGate Pipeline</text>

  <!-- Stage 1: Request Validation -->
  <rect x="300" y="170" width="500" height="42" rx="8" fill="url(#stage)" stroke="#4338ca" stroke-width="1" opacity="0.9"/>
  <text x="320" y="195" fill="#c7d2fe" font-size="12" font-weight="600">1</text>
  <text x="345" y="195" fill="#e2e8f0" font-size="13" font-weight="600">Request Validation</text>
  <text x="790" y="195" text-anchor="end" fill="#64748b" font-size="11">Path traversal · Body size · Header injection</text>

  <!-- Stage 2: Authentication -->
  <rect x="300" y="222" width="500" height="42" rx="8" fill="url(#stage)" stroke="#4338ca" stroke-width="1" opacity="0.9"/>
  <text x="320" y="247" fill="#c7d2fe" font-size="12" font-weight="600">2</text>
  <text x="345" y="247" fill="#e2e8f0" font-size="13" font-weight="600">Agent Authentication</text>
  <text x="790" y="247" text-anchor="end" fill="#64748b" font-size="11">X-Agent-Key · X-Master-Key · Key rotation</text>

  <!-- Stage 3: Rate Limiter -->
  <rect x="300" y="274" width="500" height="42" rx="8" fill="url(#stage)" stroke="#4338ca" stroke-width="1" opacity="0.9"/>
  <text x="320" y="299" fill="#c7d2fe" font-size="12" font-weight="600">3</text>
  <text x="345" y="299" fill="#e2e8f0" font-size="13" font-weight="600">Rate Limiter</text>
  <text x="790" y="299" text-anchor="end" fill="#64748b" font-size="11">Sliding window · Per-agent · Minute + Hour</text>

  <!-- Stage 4: Intent Analyzer -->
  <rect x="300" y="326" width="500" height="42" rx="8" fill="url(#stage)" stroke="#4338ca" stroke-width="1" opacity="0.9"/>
  <text x="320" y="351" fill="#c7d2fe" font-size="12" font-weight="600">4</text>
  <text x="345" y="351" fill="#e2e8f0" font-size="13" font-weight="600">Intent Analyzer</text>
  <text x="790" y="351" text-anchor="end" fill="#64748b" font-size="11">L1 method + L2 path pattern · &lt; 5ms</text>

  <!-- Stage 5: Policy Engine -->
  <rect x="300" y="378" width="500" height="42" rx="8" fill="url(#stage)" stroke="#818cf8" stroke-width="1.5" opacity="0.95"/>
  <text x="320" y="403" fill="#c7d2fe" font-size="12" font-weight="600">5</text>
  <text x="345" y="403" fill="#f1f5f9" font-size="13" font-weight="700">Policy Engine v2</text>
  <text x="790" y="403" text-anchor="end" fill="#94a3b8" font-size="11">YAML rules · Intent match · AND/OR · Hot reload</text>

  <!-- Stage 6: Webhook -->
  <rect x="300" y="430" width="500" height="42" rx="8" fill="url(#stage)" stroke="#4338ca" stroke-width="1" opacity="0.9"/>
  <text x="320" y="455" fill="#c7d2fe" font-size="12" font-weight="600">6</text>
  <text x="345" y="455" fill="#e2e8f0" font-size="13" font-weight="600">Webhook Notifier</text>
  <text x="790" y="455" text-anchor="end" fill="#64748b" font-size="11">Deny alerts · Threshold-based · Cooldown</text>

  <!-- Stage 7: Audit -->
  <rect x="300" y="482" width="500" height="42" rx="8" fill="url(#stage)" stroke="#4338ca" stroke-width="1" opacity="0.9"/>
  <text x="320" y="507" fill="#c7d2fe" font-size="12" font-weight="600">7</text>
  <text x="345" y="507" fill="#e2e8f0" font-size="13" font-weight="600">Audit Logger</text>
  <text x="790" y="507" text-anchor="end" fill="#64748b" font-size="11">SQLite · Stats · CSV/JSON export · Auto-purge</text>

  <!-- Decision arrows from Policy Engine -->
  <!-- Allow arrow -->
  <path d="M800 399 L870 399 L870 320 L910 320" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <defs><marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#22c55e"/></marker></defs>

  <!-- Deny arrow -->
  <path d="M800 399 L870 399 L870 440 L910 440" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <defs><marker id="arrowRed" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ef4444"/></marker></defs>

  <!-- Allow box -->
  <rect x="915" y="295" width="240" height="50" rx="10" fill="url(#allow)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1035" y="316" text-anchor="middle" fill="#d1fae5" font-size="13" font-weight="700">ALLOW</text>
  <text x="1035" y="334" text-anchor="middle" fill="#6ee7b7" font-size="11">→ Forward to SaaS API</text>

  <!-- Deny box -->
  <rect x="915" y="415" width="240" height="50" rx="10" fill="url(#deny)" stroke="#f87171" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1035" y="436" text-anchor="middle" fill="#fecaca" font-size="13" font-weight="700">DENY</text>
  <text x="1035" y="454" text-anchor="middle" fill="#fca5a5" font-size="11">← 403 + Structured reason</text>

  <!-- Right: SaaS APIs -->
  <rect x="940" y="180" width="190" height="80" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1035" y="210" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">SaaS APIs</text>
  <text x="1035" y="230" text-anchor="middle" fill="#64748b" font-size="11">Google · Microsoft · Slack</text>
  <text x="1035" y="248" text-anchor="middle" fill="#64748b" font-size="11">MCP Servers</text>

  <!-- Arrow: Allow → SaaS -->
  <path d="M1035 295 L1035 260" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Bottom bar: Tech stack -->
  <rect x="40" y="645" width="1120" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="672" text-anchor="middle" fill="#64748b" font-size="12" letter-spacing="1">
    Python 3.12  ·  FastAPI  ·  httpx  ·  SQLite  ·  Docker  ·  187 Tests  ·  MIT License
  </text>

  <!-- Connector dots (decorative) -->
  <circle cx="550" y="540" r="2" fill="#4338ca" opacity="0.5"/>
  <circle cx="550" y="555" r="2" fill="#4338ca" opacity="0.3"/>
  <circle cx="550" y="570" r="2" fill="#4338ca" opacity="0.15"/>

  <!-- MCP badge -->
  <rect x="300" y="545" width="140" height="30" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="370" y="565" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">MCP Auth Proxy</text>

  <!-- SDK badge -->
  <rect x="460" y="545" width="160" height="30" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="540" y="565" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">Python + TS SDKs</text>

  <!-- YAML badge -->
  <rect x="640" y="545" width="160" height="30" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="720" y="565" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">YAML Policy Engine</text>
</svg>
